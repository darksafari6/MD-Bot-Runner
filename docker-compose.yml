services:
  apphost:
    build: .
    image: apphost:4
    container_name: apphost
    restart: unless-stopped
    ports:
      # Bind to loopback: the panel controls processes on this machine.
      - "127.0.0.1:8080:8080"
    environment:
      APPHOST_HOST: 0.0.0.0
      APPHOST_PORT: "8080"
      APPHOST_DATA_DIR: /data
      # Leave empty to auto-generate a token in /data/token; set it to pin one.
      APPHOST_TOKEN: ${APPHOST_TOKEN:-}
      APPHOST_MAX_APPS: "10"
    volumes:
      - apphost-data:/data
      # Mount the projects you want to run, read-write so npm can install.
      - ${PROJECTS_DIR:-./projects}:/projects
    security_opt:
      - no-new-privileges:true

volumes:
  apphost-data:
