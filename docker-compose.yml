services:
  wamanager:
    build: .
    image: wamanager:latest
    container_name: wamanager
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # Strongly recommended whenever the port is reachable.
      API_TOKEN: ${API_TOKEN:-}
      MAX_INSTANCES: ${MAX_INSTANCES:-10}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    volumes:
      # Credentials + SQLite database. Losing this logs every bot out.
      - wamanager-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  wamanager-data:
