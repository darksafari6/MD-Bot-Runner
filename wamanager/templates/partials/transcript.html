{% if error %}
<p class="error-line">{{ error }}</p>
{% endif %}

<div class="transcript" hx-get="/partials/bots/{{ bot_id }}/messages{% if selected %}?chat_jid={{ selected | urlencode }}{% endif %}" hx-trigger="every 5s" hx-swap="outerHTML">
  {% for message in messages %}
  <div class="bubble {{ 'out' if message.direction == 'out' else 'in' }}">
    <div class="bubble-meta">
      <span>{{ 'Bot' if message.direction == 'out' else message.sender_name }}</span>
      {% if message.origin in ('command', 'ai') %}<span class="tag">{{ message.origin }}</span>{% endif %}
    </div>
    <p>{{ message.body }}</p>
  </div>
  {% else %}
  <p class="muted small">No messages yet for this chat.</p>
  {% endfor %}
</div>
