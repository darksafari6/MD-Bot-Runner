<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>{% block title %}WhatsApp MD Bot Runner{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/htmx.min.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">◈</span>
        <span>WhatsApp MD <strong>Bot Runner</strong></span>
      </a>
      <nav class="topnav">
        <a href="/">Dashboard</a>
        <a href="/docs" target="_blank" rel="noopener">API docs</a>
        <span class="pill" id="live-pill" title="Server-sent events">
          <span class="dot"></span> live
        </span>
      </nav>
    </header>

    <main class="shell">{% block content %}{% endblock %}</main>

    <footer class="footer">
      <span>v{{ version }} · Python · neonize · FastAPI</span>
      <span class="muted">Unofficial WhatsApp automation — use a dedicated number.</span>
    </footer>

    <script src="/static/app.js" defer></script>
  </body>
</html>
