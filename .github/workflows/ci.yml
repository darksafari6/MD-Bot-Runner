name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and UI tests
        run: npm test

      - name: Build UI + server
        run: npm run build

      - name: Smoke test the built server
        run: |
          WAMANAGER_DATA_DIR="$RUNNER_TEMP/data" PORT=3111 node dist-server/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3111/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3111/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf -o /dev/null http://127.0.0.1:3111/
          kill $SERVER_PID
