name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # the runner tests start real Node processes

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check apphost tests
          ruff format --check apphost tests

      - name: Shell scripts
        run: |
          bash -n scripts/install.sh
          bash -n packaging/build-deb.sh

      - name: Tests
        run: pytest -q

  smoke:
    name: Smoke test (real server + real Vite app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host
        run: pip install -e ".[dev]"

      - name: Doctor
        run: apphost doctor

      - name: Real end-to-end run (npm install, start, proxy)
        run: python scripts/smoke.py

  package:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: ./packaging/build-deb.sh

      - name: Verify package
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb | head -1)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -q "usr/lib/systemd/system/apphost.service"
          # the venv must not point back at the build directory
          rm -rf /tmp/pkgcheck && dpkg-deb -x "$deb" /tmp/pkgcheck
          if grep -rq "$GITHUB_WORKSPACE" /tmp/pkgcheck/usr/lib/apphost/venv; then
            echo "package contains build paths"; exit 1
          fi
          /tmp/pkgcheck/usr/lib/apphost/venv/bin/python -c "import apphost; print(apphost.VERSION)"

      - uses: actions/upload-artifact@v4
        with:
          name: apphost-deb
          path: dist/*.deb
          retention-days: 14
