name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          # libmagic is required by neonize; ffmpeg enables media features.
          sudo apt-get install -y -qq libmagic1 ffmpeg

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check wamanager tests
          ruff format --check wamanager tests

      - name: Tests
        run: pytest -q

      - name: Shell syntax
        run: bash -n scripts/install.sh

      - name: Import smoke test
        run: |
          python -c "import wamanager, wamanager.api, wamanager.engine, wamanager.tui"
          wa --help > /dev/null

      - name: Server smoke test
        run: |
          export WAMANAGER_DATA_DIR="$RUNNER_TEMP/data" PORT=8099
          wa serve &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/api/health | grep -q '"status":"ok"'
          curl -sf -o /dev/null http://127.0.0.1:8099/
          curl -sf -o /dev/null http://127.0.0.1:8099/static/app.css
          kill "$SERVER_PID"
