[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apphost"
version = "4.0.0"
description = "Linux app host for Node.js, Vite and React projects — run, supervise and proxy them from one panel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "App Host contributors" }]
keywords = ["linux", "node", "vite", "react", "supervisor", "runner", "proxy", "systemd"]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "websockets>=12"]

[project.scripts]
apphost = "apphost.cli:main"

[project.urls]
Repository = "https://github.com/darksafari6/Whatsapp-MD-bot-Runner-Manager"
Documentation = "https://github.com/darksafari6/Whatsapp-MD-bot-Runner-Manager#readme"

[tool.hatch.build.targets.wheel]
packages = ["apphost"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # typer uses function calls in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
