[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wamanager"
version = "3.0.0"
description = "Linux-native control panel for multiple WhatsApp Multi-Device bots, with AI replies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WhatsApp MD Bot Runner Manager contributors" }]
keywords = ["whatsapp", "bot", "baileys", "whatsmeow", "ai", "linux"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

dependencies = [
  "neonize>=0.10.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "segno>=1.6",
  "textual>=0.80",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
wa = "wamanager.cli:main"

[project.urls]
Repository = "https://github.com/darksafari6/Whatsapp-MD-bot-Runner-Manager"

[tool.hatch.build.targets.wheel]
packages = ["wamanager"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # typer uses function calls in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
